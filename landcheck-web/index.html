    <script>
      (function () {
        if (typeof window === "undefined" || !("caches" in window)) return;
        var path = window.location.pathname || "/";
        var isGreenRoute =
          path === "/green" ||
          path === "/green/" ||
          path === "/green-work" ||
          path === "/green-work/" ||
          path.indexOf("/green/") === 0 ||
          path.indexOf("/green-work/") === 0;

        if (isGreenRoute) return;

        caches
          .keys()
          .then(function (keys) {
            return Promise.all(
              keys
                .filter(function (key) {
                  return key.indexOf("green-shell-") === 0;
                })
                .map(function (key) {
                  return caches.delete(key);
                })
            );
          })
          .catch(function () {});

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then(function (registrations) {
              return Promise.all(
                registrations.map(function (registration) {
                  return registration.unregister();
                })
              );
            })
            .catch(function () {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Last-resort fallback, shown only if nothing has rendered into #root a few seconds after
         the page loaded (see the watchdog script below). Styled by hand, inline, matching the
         Estates brand tokens (estate-portal.css is the source of truth) rather than relying on
         any external stylesheet - this has to render correctly even when every other asset on
         the page, including the app's own CSS, failed to load. Hidden by default; CSS-only, no
         JS needed to show/hide it beyond toggling this one class. -->
    <div id="landcheck-boot-fallback" class="landcheck-boot-fallback">
      <div class="landcheck-boot-fallback-card">
        <div class="landcheck-boot-fallback-kicker">LandCheck</div>
        <div class="landcheck-boot-fallback-title" role="heading" aria-level="1">Something went wrong loading this page.</div>
        <p>This can happen after a new version is released, or from a temporary glitch. Reloading usually fixes it.</p>
        <button type="button" onclick="window.__landcheckRetry()">Reload LandCheck</button>
        <p class="landcheck-boot-fallback-footer">
          Still stuck after reloading? <a href="/">Go to the homepage</a> or email
          <a href="mailto:support@landcheck.online">support@landcheck.online</a>.
        </p>
      </div>
    </div>
    <style>
      .landcheck-boot-fallback {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        background: #f5f3eb;
        font-family: "Aptos", "Segoe UI", Arial, sans-serif;
      }
      .landcheck-boot-fallback.is-visible {
        display: flex;
      }
      .landcheck-boot-fallback-card {
        width: min(92vw, 540px);
        border-radius: 4px;
        border: 1px solid rgba(16, 42, 39, 0.16);
        background: #ffffff;
        box-shadow: 0 18px 40px rgba(16, 36, 58, 0.08);
        padding: 2rem 1.75rem;
      }
      .landcheck-boot-fallback-kicker {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        color: #16816e;
        margin-bottom: 0.9rem;
      }
      .landcheck-boot-fallback-title {
        margin: 0 0 0.7rem;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-weight: 500;
        font-size: 1.9rem;
        line-height: 1.15;
        color: #102a27;
      }
      .landcheck-boot-fallback-card p {
        margin: 0 0 1.3rem;

        font-size: 0.95rem;
        line-height: 1.65;
      }
      .landcheck-boot-fallback-card button {
        width: 100%;

        border: 0;
        border-radius: 2px;
        background: #102a27;
        color: #ffffff;
        font-family: inherit;

        font-weight: 700;

      }
      .landcheck-boot-fallback-footer {
        margin: 1rem 0 0 !important;
        font-size: 0.84rem !important;
      }
      .landcheck-boot-fallback-footer a {
        color: #102a27;
        font-weight: 700;
        text-decoration: underline;
      }
      .lc-seo-shell {
        min-height: 100vh;
        padding: clamp(5rem, 12vw, 9rem) 1.25rem;
        background: #f7f7f2;
        color: #102a27;

      }
      .lc-seo-shell__inner {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: clamp(1.5rem, 5vw, 3.25rem);
        border: 1px solid rgba(16, 42, 39, 0.12);
        border-radius: 1rem;

      .lc-seo-shell__eyebrow {

        margin: 0;

    <script>
      // Recovers from the entry bundle itself failing to load after a deploy (a stale tab asking
      // for a previous build's hashed filename that no longer exists). This has to sit here, in
      // plain JS before the module script below, because the failure happens before any React
      // code - including lazyWithChunkRecovery.ts's own recovery logic - has had a chance to run.
      // A resource-load failure on a <script> tag doesn't bubble, so it has to be caught with a
      // capturing listener on window, not a plain try/catch.
      (function () {
        if (typeof window === "undefined") return;
        var STORAGE_KEY = "landcheck.entry-reload-attempted";

        function showFallback() {
          var el = document.getElementById("landcheck-boot-fallback");
          if (el) el.classList.add("is-visible");
        }

        function clearStaleRuntimeState() {
          var tasks = [];
          if ("caches" in window) {
            tasks.push(
              window.caches
                .keys()
                .then(function (keys) {
                  return Promise.all(
                    keys.map(function (key) {
                      return window.caches.delete(key);
                    }),
                  );
                })
                .catch(function () {}),
            );
          }
          if ("serviceWorker" in navigator) {
            tasks.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (registrations) {
                  return Promise.all(
                    registrations.map(function (registration) {
                      return registration.unregister();
                    }),
                  );
                })
                .catch(function () {}),
            );
          }
          return Promise.all(tasks);
        }

        function reloadFromFreshShell(resetAttempt) {
          if (resetAttempt) {
            try {
              window.sessionStorage.removeItem(STORAGE_KEY);
            } catch (e) {
              // Storage can be unavailable in private browsing; the reload still helps.
            }
          }
          clearStaleRuntimeState().then(function () {
            var url = new URL(window.location.href);
            url.searchParams.set("__lc_reload", String(Date.now()));
            window.location.replace(url.pathname + url.search + url.hash);
          });
        }

        // The visible fallback remains useful when a deployment is genuinely broken, but its
        // button should give the user one clean retry instead of reloading the same stale shell.
        window.__landcheckRetry = function () {
          reloadFromFreshShell(true);
        };

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (!target || target.tagName !== "SCRIPT" || target.getAttribute("type") !== "module") return;
            var already = false;
            try {
              already = window.sessionStorage.getItem(STORAGE_KEY) === "1";
              if (!already) window.sessionStorage.setItem(STORAGE_KEY, "1");
            } catch (e) {
              // Private browsing / storage disabled - fall through and still attempt one reload,
              // just without the loop guard.
            }
            if (already) {
              // The one guarded reload already happened and this is still failing - stop
              // reloading (that would loop for as long as the server-side problem lasts) and
              // show the plain-HTML fallback instead, so the person is never just looking at a
              // blank page with nothing to do about it.
              showFallback();
              return;
            }
            // A short pause gives an in-flight deploy a moment to finish before the retry. Clear
            // stale service-worker/cache state first so the old shell cannot request the same
            // missing hashed entry again after a successful deployment.
            window.setTimeout(function () {
              reloadFromFreshShell(false);
            }, 1200);
          },
          true,
        );

        // A second, independent backstop that doesn't depend on catching any particular error
        // event at all: if nothing has rendered into #root a few seconds after the page loaded,
        // something is wrong regardless of why (a hung fetch that never rejects, a blocked
        // request, anything this file's error listener doesn't happen to match) - show the same
        // fallback rather than leaving an unexplained blank page.
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.dataset.landcheckReactMounted !== "true") {
              showFallback();
            } else {
              // Allow a later deploy to use the one-shot recovery again after this tab has
              // successfully rendered the application.
              try {
                window.sessionStorage.removeItem(STORAGE_KEY);
              } catch (e) {
                // Storage can be unavailable in private browsing.
              }
            }
          }, 6000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
