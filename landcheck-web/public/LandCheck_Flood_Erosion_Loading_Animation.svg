<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
  <title id="title">LandCheck flood vulnerability and erosion loading animation</title>
  <desc id="desc">Animated terrain contours, rising flood waves, a risk scan and a loading indicator.</desc>

  <defs>
    <linearGradient id="riskGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".46"/>
      <stop offset="1" stop-color="#0284C7" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="progressGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".38" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="riskScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mapClip">
      <rect x="28" y="28" width="84" height="84" rx="14"/>
    </clipPath>
    <clipPath id="progressClip">
      <rect x="140" y="137" width="336" height="4" rx="2"/>
    </clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .contour { fill: none; stroke: #22C55E; stroke-width: 1.4; opacity: .42; stroke-dasharray: 5 5; animation: contour-flow 4s linear infinite; }
    .contour.two { animation-delay: -.8s; opacity: .3; }
    .contour.three { animation-delay: -1.6s; opacity: .22; }
    .wave { animation: wave-shift 2.6s ease-in-out infinite alternate; }
    .wave.back { animation-delay: -.9s; opacity: .45; }
    .scan { animation: scan 2.2s cubic-bezier(.4,0,.2,1) infinite; }
    .risk-ring { transform-box: fill-box; transform-origin: center; animation: risk-pulse 1.7s ease-out infinite; }
    .progress { animation: progress-slide 1.9s cubic-bezier(.4,0,.2,1) infinite; }
    .status { animation: breathe 1.9s ease-in-out infinite; }

    @keyframes contour-flow { to { stroke-dashoffset: -30; } }
    @keyframes wave-shift {
      from { transform: translate(-7px, 4px); }
      to { transform: translate(7px, -2px); }
    }
    @keyframes scan {
      0% { transform: translateY(-74px); opacity: 0; }
      15%, 80% { opacity: .9; }
      100% { transform: translateY(76px); opacity: 0; }
    }
    @keyframes risk-pulse {
      0% { transform: scale(.35); opacity: .95; }
      75%, 100% { transform: scale(2.3); opacity: 0; }
    }
    @keyframes progress-slide {
      0% { transform: translateX(-350px); }
      58%, 100% { transform: translateX(350px); }
    }
    @keyframes breathe { 0%, 100% { opacity: .56; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .contour, .wave, .scan, .risk-ring, .progress, .status { animation: none; }
      .scan { transform: translateY(0); opacity: .65; }
      .progress { transform: translateX(0); }
    }
  </style>

  <!-- Flood and erosion map symbol -->
  <g clip-path="url(#mapClip)">
    <rect x="28" y="28" width="84" height="84" rx="14" fill="#0C4A6E" opacity=".12"/>

    <!-- Terrain contours represent erosion susceptibility -->
    <path class="contour" d="M20 54 C38 34 61 46 69 34 C78 21 102 25 122 44"/>
    <path class="contour two" d="M18 67 C40 46 58 63 75 48 C90 35 107 45 124 58"/>
    <path class="contour three" d="M18 80 C37 65 54 77 68 66 C84 53 105 59 124 73"/>

    <!-- Water moves laterally and rises across the terrain -->
    <path class="wave back" d="M12 77 C25 68 37 86 51 77 C65 68 77 86 91 77 C104 69 116 84 130 77 L130 122 L12 122 Z" fill="url(#waterGradient)"/>
    <path class="wave" d="M10 86 C24 76 37 96 52 86 C67 76 79 96 94 86 C107 77 121 94 134 86 L134 124 L10 124 Z" fill="url(#waterGradient)" stroke="#38BDF8" stroke-width="2.4"/>

    <!-- Vulnerability scan -->
    <rect class="scan" x="27" y="61" width="86" height="10" fill="url(#riskScan)" opacity=".8"/>
  </g>
  <rect x="28" y="28" width="84" height="84" rx="14" fill="none" stroke="url(#riskGradient)" stroke-width="3"/>

  <!-- Located high-risk point -->
  <circle class="risk-ring" cx="91" cy="58" r="7" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <g filter="url(#glow)">
    <circle cx="91" cy="58" r="4.5" fill="#F59E0B"/>
  </g>

  <!-- Wordmark and module label -->
  <text x="140" y="83" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-1.7">
    <tspan fill="#F1F5F9">Land</tspan><tspan fill="#22C55E">Check</tspan>
  </text>
  <text x="143" y="113" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.35" fill="#38BDF8">FLOOD &amp; EROSION RISK</text>

  <!-- Loading rail -->
  <rect x="140" y="137" width="336" height="4" rx="2" fill="#94A3B8" opacity=".18"/>
  <g clip-path="url(#progressClip)">
    <rect class="progress" x="140" y="137" width="150" height="4" rx="2" fill="url(#progressGradient)"/>
  </g>
  <text class="status" x="140" y="168" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Analysing flood vulnerability and erosion risk…</text>
</svg>
