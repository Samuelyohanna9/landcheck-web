<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
  <!-- The corner-marker icon from logo.svg's wordmark, isolated to its own square viewBox so it
       reads correctly as a browser-tab favicon (the full wordmark is far too wide to crop into a
       square without cutting off the mark or the text). Same gradient and geometry, not a new
       design - see logo.svg for where this is also used, inline in the site header. -->
  <defs>
    <linearGradient id="brandGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="72" height="72" rx="10" fill="none" stroke="url(#brandGreen)" stroke-width="6"/>
  <circle cx="6" cy="6" r="7" fill="url(#brandGreen)"/>
  <circle cx="78" cy="6" r="7" fill="url(#brandGreen)"/>
  <circle cx="78" cy="78" r="7" fill="url(#brandGreen)"/>
  <circle cx="6" cy="78" r="7" fill="url(#brandGreen)"/>
  <path d="M22 60 L62 28" stroke="url(#brandGreen)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="42" cy="44" r="4.5" fill="url(#brandGreen)"/>
</svg>
