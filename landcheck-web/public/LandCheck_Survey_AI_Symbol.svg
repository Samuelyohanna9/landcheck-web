<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LandCheck Survey AI symbol</title>
  <desc id="desc">A surveyed land boundary with control points, coordinate scan and artificial intelligence nodes.</desc>
  <defs>
